<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-chat profile selector</title>
<!--
  Standalone copy of the selector from site/index.html, for porting into a
  Sprinklr pre-chat step if A1 Q4 allows one. Stores nothing: no localStorage,
  no sessionStorage, no cookie, no network call. N-2.
  Profile B is deliberately absent - QA Ruling 02, item 19.
-->
<style>
:root{
  --ink:#15231F; --deep:#103B32; --paper:#F7F8F7; --card:#FFFFFF;
  --muted:#5F6F69; --line:#DCE2DF; --signal:#F5C518; --signal-ink:#231D00;
  --rail:44px; --edge:26px;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --measure:64ch;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:2rem 1rem;background:var(--paper);color:var(--ink);
     font-family:var(--sans);font-size:17px;line-height:1.6;display:grid;place-items:start center}
#prechat{inline-size:min(420px,100%)}
h2{font-family:var(--sans);font-weight:600;margin:0}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
/* profile selector */
.selector{
  background:var(--card); border:1px solid var(--line); border-start-start-radius:4px;
  border-start-end-radius:4px; border-end-end-radius:4px; border-end-start-radius:4px;
  padding:1.5rem; box-shadow:0 1px 0 var(--line);
}
.selector h2{font-size:1.15rem; font-family:var(--sans); font-weight:600; margin-bottom:.3rem}
.selector .hint{font-size:.88rem; color:var(--muted); margin-bottom:1.1rem}
.opt{
  display:flex; gap:.85rem; align-items:flex-start; inline-size:100%; text-align:start;
  background:var(--paper); border:1px solid var(--line); border-radius:3px;
  padding:.9rem 1rem; margin-block-end:.6rem; cursor:pointer; font:inherit; color:inherit;
}
.opt:hover{border-color:var(--deep); background:#fff}
.opt[aria-pressed="true"]{border-color:var(--deep); background:#fff; box-shadow:inset 3px 0 0 var(--deep)}
html[dir="rtl"] .opt[aria-pressed="true"]{box-shadow:inset -3px 0 0 var(--deep)}
.opt .t{font-weight:600; font-size:.96rem; display:block}
.opt .d{font-size:.84rem; color:var(--muted); display:block; margin-block-start:.15rem}
.opt .pin{
  flex:none; inline-size:34px; block-size:34px; border-radius:50%; background:var(--deep); color:#fff;
  display:grid; place-items:center; font-size:.8rem; font-weight:600;
}
.opt .pin.guest{background:var(--muted)}
.intake{margin-block-start:1rem; padding-block-start:1rem; border-block-start:1px solid var(--line)}
.intake[hidden]{display:none}
.intake p{font-size:.9rem; font-weight:600; margin:0 0 .55rem}
.chips{display:flex; flex-wrap:wrap; gap:.45rem; margin-block-end:1rem}
.chip{
  font:500 .86rem var(--sans); background:var(--paper); border:1px solid var(--line);
  border-radius:999px; padding:.4rem .85rem; cursor:pointer; color:inherit;
}
.chip:hover{border-color:var(--deep)}
.chip[aria-pressed="true"]{background:var(--deep); border-color:var(--deep); color:#fff}
.start{
  inline-size:100%; font:600 .95rem var(--sans); background:var(--deep); color:#fff;
  border:0; border-radius:3px; padding:.8rem 1rem; cursor:pointer; margin-block-start:.4rem;
}
.start:disabled{background:#9DAAA5; cursor:not-allowed}
.vars{
  margin-block-start:.9rem; font:400 .78rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted); background:var(--paper); border:1px dashed var(--line);
  border-radius:3px; padding:.7rem .8rem; white-space:pre-wrap; overflow-wrap:anywhere;
}
.vars[hidden]{display:none}
</style>
</head>
<body>
<!-- ============ PRE-CHAT PROFILE SELECTOR (stores nothing — N-2) ============ -->
    <div class="selector" id="prechat">
      <h2 data-i18n="selH2">Choose a profile</h2>
      <p class="hint" data-i18n="selHint">Sample profiles for the demonstration. Nothing you select is stored.</p>

      <button class="opt" type="button" data-profile="A" aria-pressed="false">
        <span class="pin" aria-hidden="true">NI</span>
        <span>
          <span class="t" data-i18n="optAT">Najd Industrial Co.</span>
          <span class="d" data-i18n="optAD">Signed in · Small business · all journeys available</span>
        </span>
      </button>

      <button class="opt" type="button" data-profile="GUEST" aria-pressed="false">
        <span class="pin guest" aria-hidden="true">?</span>
        <span>
          <span class="t" data-i18n="optGT">Continue as a guest</span>
          <span class="d" data-i18n="optGD">Not signed in · account opening, branches and cards</span>
        </span>
      </button>

      <!-- guest intake: two questions about the business, no personal data (Ruling 01 §H) -->
      <div class="intake" id="intake" hidden>
        <p data-i18n="q1">What does your business need today?</p>
        <div class="chips" data-group="need">
          <button class="chip" type="button" data-val="open" aria-pressed="false" data-i18n="q1a">Open an account</button>
          <button class="chip" type="button" data-val="info" aria-pressed="false" data-i18n="q1b">Branch or product information</button>
          <button class="chip" type="button" data-val="other" aria-pressed="false" data-i18n="q1c">Something else</button>
        </div>
        <div id="q2wrap" hidden>
          <p data-i18n="q2">What type of entity?</p>
          <div class="chips" data-group="entity">
            <button class="chip" type="button" data-val="sole" aria-pressed="false" data-i18n="q2a">Sole Establishment</button>
            <button class="chip" type="button" data-val="llc" aria-pressed="false" data-i18n="q2b">LLC</button>
            <button class="chip" type="button" data-val="other" aria-pressed="false" data-i18n="q2c">Other</button>
          </div>
        </div>
      </div>

      <button class="start" id="startChat" type="button" disabled data-i18n="startBtn">Select a profile to start</button>
      <div class="vars" id="varsOut" hidden></div>
    </div>
<script>
(function(){
  "use strict";
  var PROFILES = {
    A: { profile_mode:"LOGGED_IN", customer_name:"Faisal Al-Harbi", company_name:"Najd Industrial Co.",
         cif:"12345678", segment:"Small", otp:"123456" },
    GUEST: { profile_mode:"GUEST", customer_name:"", company_name:"", cif:"", segment:"Prospect", otp:"" }
  };
  var state = { profile:null, need:null, entity:null };
  var $  = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function refresh(){
    var ready = state.profile === "A" || (state.profile === "GUEST" && state.need !== null);
    var b = $("#startChat");
    b.disabled = !ready;
    b.textContent = ready ? "Start the conversation" : "Select a profile to start";
  }
  $$(".opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.profile = btn.getAttribute("data-profile");
      $$(".opt").forEach(function(o){ o.setAttribute("aria-pressed", String(o===btn)); });
      var guest = state.profile === "GUEST";
      $("#intake").hidden = !guest;
      if(!guest){ state.need=null; state.entity=null; $("#q2wrap").hidden=true;
                  $$(".chip").forEach(function(c){ c.setAttribute("aria-pressed","false"); }); }
      $("#varsOut").hidden = true; refresh();
    });
  });
  $$(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      var g = c.parentNode.getAttribute("data-group");
      $$('[data-group="'+g+'"] .chip').forEach(function(o){ o.setAttribute("aria-pressed", String(o===c)); });
      if(g==="need"){ state.need=c.getAttribute("data-val");
                      $("#q2wrap").hidden = state.need!=="open";
                      if(state.need!=="open") state.entity=null; }
      else { state.entity = c.getAttribute("data-val"); }
      refresh();
    });
  });
  function getVars(){
    var p = PROFILES[state.profile || "GUEST"];
    var v = { profile_mode:p.profile_mode, customer_name:p.customer_name,
              company_name:p.company_name, cif:p.cif, segment:p.segment, otp:p.otp };
    if(state.profile==="GUEST"){ if(state.need) v.guest_need=state.need;
                                 if(state.entity) v.guest_entity=state.entity; }
    return v;
  }
  $("#startChat").addEventListener("click", function(){
    /* >>> Sprinklr pre-chat submit goes here. Nothing is persisted. */
    var v = getVars(), out = $("#varsOut");
    out.hidden = false;
    out.textContent = "Variables for the widget:\n\n" +
      Object.keys(v).map(function(k){ return k+" = "+(v[k]===""?"(empty)":v[k]); }).join("\n");
  });
  refresh();
})();
</script>
</body>
</html>
